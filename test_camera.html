<!DOCTYPE html>
<html>
<head>
    <title>Camera Test</title>
</head>
<body>
    <h1>Camera Stream Test</h1>
    <img src="http://127.0.0.1:5000/video_feed" style="width: 640px; height: 480px; border: 2px solid #333;" />
    <br><br>
    <button onclick="location.reload()">Refresh Stream</button>
    <p>If you see ERR_CONNECTION_RESET, try these solutions:</p>
    <ul>
        <li>Open in Chrome instead of Edge</li>
        <li>Disable browser extensions</li>
        <li>Clear browser cache</li>
        <li>Try different port (restart app with different port)</li>
    </ul>
</body>
</html>
